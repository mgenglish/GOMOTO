<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>GOMOFO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-live="polite">
    <header>
      <div id="weather" class="corner">--°</div>
      <div id="clock">--:--</div>
      <div id="battery" class="corner battery">▱ --%</div>
    </header>

    <section class="dashboard">
      <div id="left-signal" class="signal">◀</div>
      <div class="speed"><span id="speed">0</span><small>MPH</small><p id="odometer">TRIP 0.0 MI</p></div>
      <div id="right-signal" class="signal">▶</div>
    </section>

    <section class="music" id="music">MUSIC WILL GO HERE LATER</section>
    <section class="turn-banner" aria-label="Navigation instruction">
      <span class="turn-arrow" aria-hidden="true">↑</span>
      <div><strong>MAP FOLLOWS YOU</strong><small>TURN DIRECTIONS COME NEXT</small></div>
    </section>
    <section class="map-panel" aria-label="Map">
      <div class="map-heading"><span>MAP</span><span id="map-status">START RIDE TO LOCATE</span></div>
      <iframe id="map" title="Your location map" loading="lazy"></iframe>
    </section>

    <button id="ride-button">START RIDE</button>
    <button id="settings" aria-label="Settings">⚙</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
